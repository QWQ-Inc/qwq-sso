name: ✨ 功能建议
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 描述你遇到的需求或痛点。
      placeholder: 我希望能够……，因为现在……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你期望的方案
      description: 希望它怎么工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他考虑过的方案（可选）
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充信息（可选）
      description: 截图、参考链接、相关场景等。
    validations:
      required: false
