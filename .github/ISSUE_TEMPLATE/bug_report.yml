name: 🐛 Bug 反馈
description: 报告一个问题 / 缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先确认这**不是安全漏洞**——安全问题请走 [安全策略](../../blob/main/SECURITY.md)，不要在公开 Issue 里提交。
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么？你期望的是什么？
      placeholder: 清晰描述现象，以及你期望的正确行为。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何重现这个问题？
      placeholder: |
        1. 进入「……」页面
        2. 点击「……」
        3. 看到错误「……」
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 页脚显示的 `QWQ SSO vX.Y.Z`
      placeholder: "例如 v3.5.124"
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - 自托管
        - qwqsso.zeabur.app（官方）
        - 其他 / 不确定
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境信息（可选）
      description: 浏览器 / 操作系统 / Node 版本、相关日志或截图（**请勿包含密钥、令牌等敏感信息**）
      placeholder: Chrome 131 / Windows 11 / Node 20 …
    validations:
      required: false
