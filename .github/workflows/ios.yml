name: iOS Build

# GitHub 的 macOS runner 自带 Xcode，可在云端编译 iOS App。
# 本工作流做「未签名」构建（免费、无需任何证书），用于验证工程能编译。
# 想产出可安装/上架的「已签名 .ipa」，见文件底部注释（需 Apple 开发者证书 + GitHub Secrets）。

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, simulator)
        run: |
          xcodebuild \
            -project QWQSSO.xcodeproj \
            -scheme QWQSSO \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

# ─────────────────────────────────────────────────────────────
# 出「已签名 .ipa」（TestFlight / 真机安装）时，追加一个 job，大致如下：
#
#   1. 在 GitHub 仓库 Settings → Secrets 里放：
#      BUILD_CERTIFICATE_BASE64   (导出的 .p12 证书，base64)
#      P12_PASSWORD               (.p12 密码)
#      PROVISIONING_PROFILE_BASE64(描述文件 .mobileprovision，base64)
#      APPLE_TEAM_ID              (你的 Team ID)
#   2. 用 apple-actions/import-codesign-certs 导入证书+描述文件；
#   3. xcodebuild archive -archivePath build/QWQSSO.xcarchive ... ;
#   4. xcodebuild -exportArchive -exportOptionsPlist ExportOptions.plist
#        -archivePath build/QWQSSO.xcarchive -exportPath build/ipa ;
#   5. actions/upload-artifact 上传 build/ipa/QWQSSO.ipa。
#
# 需要 Apple 开发者账号（个人 $99/年）。没有账号时，上面的未签名构建足以验证代码可编译。
