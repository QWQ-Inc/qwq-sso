name: iOS Build

# GitHub 的 macOS runner 自带 Xcode，可在云端编译 iOS App。
# 本工作流做「未签名」构建（免费、无需任何证书），用于验证工程能编译。
# 想产出可安装/上架的「已签名 .ipa」，见文件底部注释（需 Apple 开发者证书 + GitHub Secrets）。

on:
  push:
    branches: [main]
  workflow_dispatch: {}
# 说明：本仓库发版工作流每次 rm -rf .git 重开历史再 force-push，paths 过滤在这种「无关历史」的
# force-push 下不稳定（可能整批不触发）。这里对 main 的每次 push 都跑；纯 Web 版本也会跑一次
# iOS 构建（约几分钟、免费），可接受。稳定后要省资源可改回 paths 过滤。

jobs:
  build:
    # macos-15 自带 Xcode 16，能读 XcodeGen 新版输出的 objectVersion 77 项目格式
    # （macos-14 的 Xcode 15.4 读不了 → "Unable to read project"）
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, simulator)
        run: |
          set +e
          xcodebuild \
            -project QWQSSO.xcodeproj \
            -scheme QWQSSO \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "xcodebuild exit=$code"
          if [ "$code" -ne 0 ]; then
            echo "===== tail of build.log as annotations ====="
            # 先出编译类错误，没有则出日志尾部，保证无鉴权也能看到真实原因
            hits=$(grep -nE "error:|Multiple commands|cannot find|no such module|does not contain a scheme|Unable to find a destination" build.log | head -40)
            if [ -n "$hits" ]; then
              echo "$hits" | while IFS= read -r l; do echo "::error::${l}"; done
            else
              tail -n 40 build.log | while IFS= read -r l; do [ -n "$l" ] && echo "::error::${l}"; done
            fi
            exit "$code"
          fi

# ─────────────────────────────────────────────────────────────
# 出「已签名 .ipa」（TestFlight / 真机安装）时，追加一个 job，大致如下：
#
#   1. 在 GitHub 仓库 Settings → Secrets 里放：
#      BUILD_CERTIFICATE_BASE64   (导出的 .p12 证书，base64)
#      P12_PASSWORD               (.p12 密码)
#      PROVISIONING_PROFILE_BASE64(描述文件 .mobileprovision，base64)
#      APPLE_TEAM_ID              (你的 Team ID)
#   2. 用 apple-actions/import-codesign-certs 导入证书+描述文件；
#   3. xcodebuild archive -archivePath build/QWQSSO.xcarchive ... ;
#   4. xcodebuild -exportArchive -exportOptionsPlist ExportOptions.plist
#        -archivePath build/QWQSSO.xcarchive -exportPath build/ipa ;
#   5. actions/upload-artifact 上传 build/ipa/QWQSSO.ipa。
#
# 需要 Apple 开发者账号（个人 $99/年）。没有账号时，上面的未签名构建足以验证代码可编译。
