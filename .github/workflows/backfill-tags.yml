name: Backfill tags

# 补打缺失的版本 tag + Release（手动运行）。
# 云端会话推不了 tag；而 GITHUB_TOKEN 没有 workflows 权限，GitHub 不让它给「workflow 文件与 main 不同」
# 的提交建引用。所以：
#   · 最新版本 → 直接打在 main 当前 HEAD 上（workflow 与 main 一致）
#   · 断层的旧版本 → 以该版本提交为父、树 = 该版本代码 + 当前 main 的 .github/workflows，
#     建一个快照提交再打 tag（代码与该版本完全一致，只有 CI 配置同步成当前的）
# 版本由 main 历史里提交标题「vX.Y.Z: …」识别；已存在的 tag 不动。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 补打 tag + 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force

          WF_TREE=$(git rev-parse HEAD:.github/workflows)
          LIST="${RUNNER_TEMP}/versions.txt"
          git log --reverse --format='%H %s' HEAD \
            | sed -nE 's/^([0-9a-f]{40}) (v[0-9]+(\.[0-9]+){2,3}):.*/\1 \2/p' > "$LIST"
          LATEST=$(tail -n1 "$LIST" | cut -d' ' -f2)
          echo "最新版本：$LATEST"

          notes() {   # $1 = tag → 说明文件（CHANGELOG 对应小节）
            F="${RUNNER_TEMP}/notes-$1.md"
            git show "HEAD:CHANGELOG.md" | awk -v tag="$1" '
              ($0 == "## " tag || index($0, "## " tag " ")==1) {grab=1; next}
              grab && /^## v/ {exit}
              grab {print}
            ' > "$F"
            [ -s "$F" ] || echo "Release $1" > "$F"
            echo "$F"
          }

          while read -r SHA VER; do
            if git rev-parse -q --verify "refs/tags/$VER" >/dev/null; then
              gh release view "$VER" >/dev/null 2>&1 || gh release create "$VER" --title "$VER" --notes-file "$(notes "$VER")" --verify-tag
              continue
            fi
            if [ "$VER" = "$LATEST" ]; then
              TARGET=$(git rev-parse HEAD)
            elif [ "$(git rev-parse "$SHA:.github/workflows")" = "$WF_TREE" ]; then
              TARGET="$SHA"
            else
              export GIT_INDEX_FILE="${RUNNER_TEMP}/idx-$VER"
              git read-tree "$SHA"
              git rm -r -q --cached .github/workflows
              git read-tree --prefix=.github/workflows/ "$WF_TREE"
              TREE=$(git write-tree)
              unset GIT_INDEX_FILE
              TARGET=$(git commit-tree "$TREE" -p "$SHA" -m "$VER（发行快照：代码同 ${SHA:0:7}，仅 CI 配置同步为当前版本，用于补打 tag）")
            fi
            echo "补打 $VER → $TARGET（源提交 $SHA）"
            git tag -a "$VER" -m "$VER" "$TARGET"
            git push origin "refs/tags/$VER"
            gh release create "$VER" --title "$VER" --notes-file "$(notes "$VER")" --verify-tag
          done < "$LIST"
