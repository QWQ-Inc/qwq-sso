name: Release

# 每次推送 vX.Y.Z tag → 自动在 GitHub 建 Release（线性发行记录）。
# 用 Actions 内置 GITHUB_TOKEN，无需本地 gh 登录；说明取自 CHANGELOG.md 对应小节。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release notes + publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE="${RUNNER_TEMP}/notes.md"
          # 取 CHANGELOG.md 里 "## <TAG>" 到下一个 "## v" 之间的内容作为 Release 说明
          awk -v tag="$TAG" '
            index($0, "## " tag)==1 {grab=1; next}
            grab && /^## v/ {exit}
            grab {print}
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then echo "Release $TAG" > "$NOTES_FILE"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"
          fi
