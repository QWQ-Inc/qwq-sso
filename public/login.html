<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>统一登录</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── 夜间模式（默认） ── */
    :root {
      --bg: #111111;
      --surface: #1A1A1A;
      --surface2: #242424;
      --surface3: #1E1E1E;
      --divider: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.1);
      --border-focus: #BCDC3C;
      --accent: #CCEE44;
      --accent2: #ECFFAF;
      --accent-glow: rgba(188,220,60,0.2);
      --text: #F2F2F0;
      --text-muted: #888880;
      --text-dim: #555550;
      --success: #5CB85C;
      --error: #E05252;
      --card-shadow: 0 24px 60px rgba(0,0,0,0.7);
      --left-bg: #141414;
      --qr-border: rgba(255,255,255,0.1);
      --oauth-hover: rgba(236,255,175,0.06);
    }

    /* ── 白日模式 ── */
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F0F0EC;
        --surface: #FFFFFF;
        --surface2: #ECFFAF;
        --surface3: #F6FFDA;
        --divider: rgba(0,0,0,0.08);
        --border: rgba(0,0,0,0.12);
        --border-focus: #7AAA00;
        --accent: #5A8A00;
        --accent2: #7AAA00;
        --accent-glow: rgba(90,138,0,0.15);
        --text: #111110;
        --text-muted: #555548;
        --text-dim: #AAAAAA;
        --success: #3D8C3D;
        --error: #CC2222;
        --card-shadow: 0 8px 32px rgba(0,0,0,0.1), 0 1px 2px rgba(0,0,0,0.06);
        --left-bg: #ECFFAF;
        --qr-border: rgba(0,0,0,0.12);
        --oauth-hover: rgba(0,0,0,0.04);
      }
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before { display: none; }

    .layout {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 60px;
      position: relative; z-index: 1;
    }

    /* ── 主卡片：左右分栏 ── */
    .card {
      display: flex;
      width: 100%;
      max-width: 820px;
      min-height: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      box-shadow: var(--card-shadow);
      overflow: hidden;
    }

    /* ══════════════════════════════
       左侧：第三方登录
    ══════════════════════════════ */
    .left {
      width: 300px;
      flex-shrink: 0;
      background: var(--left-bg);
      border-right: 1px solid var(--divider);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 28px;
    }

    .left-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 24px;
      align-self: flex-start;
    }

    /* 微信二维码区 */
    .qr-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    .qr-box {
      width: 154px; height: 154px;
      border: 1px solid var(--qr-border);
      border-radius: 2px;
      background: var(--surface2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .qr-box:hover { border-color: var(--accent); }

    /* 伪二维码 SVG 图案 */
    .qr-svg {
      width: 116px; height: 116px;
      opacity: 0.18;
    }

    .qr-overlay {
      position: absolute; inset: 0;
      background: rgba(120,100,255,0.85);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.2s;
      border-radius: 2px;
    }

    .qr-box:hover .qr-overlay { opacity: 1; }

    .qr-overlay span {
      color: #fff; font-size: 12px; font-weight: 600;
    }

    .qr-refresh-icon {
      width: 28px; height: 28px;
      border: 2.5px solid rgba(255,255,255,0.8);
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1.2s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .qr-label {
      margin-top: 11px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qr-label svg { opacity: 0.7; }

    /* 分割线 */
    .left-divider {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0;
      color: var(--text-dim);
      font-size: 11px;
    }
    .left-divider::before, .left-divider::after {
      content: ''; flex: 1; height: 1px;
      background: var(--divider);
    }

    /* 其他 OAuth 按钮 */
    .oauth-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .oauth-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
      font-family: inherit;
      text-align: left;
    }

    .oauth-btn:hover {
      background: var(--oauth-hover);
      border-color: rgba(120,100,255,0.3);
      transform: translateX(2px);
    }

    .oauth-icon {
      width: 24px; height: 24px;
      border-radius: 2px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .oauth-name { flex: 1; }
    .oauth-arrow { color: var(--text-dim); font-size: 14px; }

    /* ══════════════════════════════
       右侧：账号登录
    ══════════════════════════════ */
    .right {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 44px 48px;
      min-width: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 36px;
    }

    .brand-icon {
      width: 36px; height: 36px;
      border-radius: 2px;
      background: var(--accent2);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      box-shadow: 0 3px 14px var(--accent-glow);
    }

    .brand-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    /* 登录方式切换 */
    .login-modes {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--divider);
      margin-bottom: 28px;
    }

    .mode-btn {
      padding: 9px 20px 10px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
      font-family: inherit;
      margin-bottom: -1px;
    }

    .mode-btn.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    /* 面板 */
    .panel { display: none; }
    .panel.active { display: block; }

    /* 字段 */
    .field { margin-bottom: 16px; }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 6px;
      letter-spacing: 0.2px;
    }

    .input-wrap { position: relative; }

    .input-icon {
      position: absolute;
      left: 13px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      pointer-events: none;
      display: flex; align-items: center;
    }

    input[type="text"], input[type="email"],
    input[type="password"], input[type="tel"] {
      width: 100%;
      padding: 11px 13px 11px 38px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }

    input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(120,100,255,0.1);
    }

    input::placeholder { color: var(--text-dim); }

    /* 无图标输入 */
    input.no-icon { padding-left: 13px; }

    /* 验证码行 */
    .code-row { display: flex; gap: 10px; }
    .code-row input { flex: 1; }

    .btn-send {
      padding: 0 16px;
      height: 44px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--accent2);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.18s;
      font-family: inherit;
      flex-shrink: 0;
    }

    .btn-send:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(120,100,255,0.08);
    }

    .btn-send:disabled { color: var(--text-dim); cursor: default; }

    /* 主按钮 */
    .btn-primary {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: opacity 0.18s, transform 0.15s, box-shadow 0.18s;
      box-shadow: 0 4px 20px var(--accent-glow);
      font-family: inherit;
      letter-spacing: 0.3px;
    }

    .btn-primary:hover:not(:disabled) {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 8px 28px var(--accent-glow);
    }

    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.45; cursor: default; }

    /* 辅助链接行 */
    .aux-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-top: 16px;
    }

    .aux-links a, .aux-links button {
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: color 0.18s;
    }

    .aux-links a:hover, .aux-links button:hover { color: var(--accent2); }
    .aux-dot { color: var(--text-dim); font-size: 10px; }

    /* 提示 */
    .tip {
      font-size: 12px;
      padding: 10px 12px;
      border-radius: 2px;
      margin-bottom: 14px;
      display: none;
    }

    .tip.success { background: rgba(52,211,153,0.08); color: var(--success); border: 1px solid rgba(52,211,153,0.2); }
    .tip.error   { background: rgba(248,113,113,0.08); color: var(--error);   border: 1px solid rgba(248,113,113,0.2); }
    .tip.show { display: block; }

    /* 密码强度 */
    .pw-strength { display: flex; gap: 4px; margin-top: 7px; }
    .pw-bar { flex: 1; height: 3px; border-radius: 2px; background: var(--surface2); transition: background 0.3s; }

    /* 底部 */
    .footer {
      margin-top: auto;
      padding-top: 28px;
      text-align: center;
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.9;
    }

    .footer a { color: var(--text-muted); text-decoration: none; }
    .footer a:hover { color: var(--accent2); }

    /* 手机号前缀 */
    .phone-prefix {
      position: absolute;
      left: 13px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 13px;
      pointer-events: none;
      font-weight: 500;
    }

    /* ── 左侧面板切换动画 ── */
    .qr-scene {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 16px;
    }

    /* 二维码容器：微信 / 企业微信 共用 */
    .qr-frame {
      width: 154px; height: 154px;
      border: 1px solid var(--qr-border);
      border-radius: 2px;
      background: var(--surface2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    /* 微信官方 JS-SDK 注入的 iframe 撑满容器 */
    .qr-frame iframe { width: 100% !important; height: 100% !important; border: 0; }

    /* 占位伪二维码（未配置 AppID 时显示） */
    .qr-placeholder {
      width: 116px; height: 116px;
      color: var(--text);
      opacity: 0.15;
    }

    /* 过期遮罩 */
    .qr-expired-mask {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.72);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 2px;
      cursor: pointer;
    }
    .qr-expired-mask.show { display: flex; }
    .qr-expired-mask span { color: #fff; font-size: 12px; font-weight: 600; }
    .qr-spin-icon {
      width: 28px; height: 28px;
      border: 2.5px solid rgba(255,255,255,0.7);
      border-radius: 50%;
      border-top-color: transparent;
      animation: qrspin 1.2s linear infinite;
    }
    @keyframes qrspin { to { transform: rotate(360deg); } }

    .qr-brand-label {
      margin-top: 11px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 平台选择按钮列表（底部） */
    .platform-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .platform-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
      font-family: inherit;
      text-align: left;
    }

    .platform-btn:hover {
      background: var(--oauth-hover);
      border-color: rgba(120,100,255,0.32);
      transform: translateX(2px);
    }

    .platform-btn.active {
      border-color: var(--accent);
      background: rgba(120,100,255,0.08);
      color: var(--text);
    }

    .platform-btn .p-icon {
      width: 24px; height: 24px;
      border-radius: 2px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .platform-btn .p-name { flex: 1; }
    .platform-btn .p-status {
      font-size: 11px;
      color: var(--accent2);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .platform-btn.active .p-status { opacity: 1; }

    .left-sep {
      width: 100%;
      height: 1px;
      background: var(--divider);
      margin: 14px 0;
    }

    /* ══════════════════════════════
       右侧：整体紧凑化
    ══════════════════════════════ */
    .right {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 32px 36px;
      min-width: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 24px;
    }

    .brand-icon {
      width: 30px; height: 30px;
      border-radius: 2px;
      background: var(--accent2);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      box-shadow: 0 3px 10px var(--accent-glow);
    }

    .brand-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    /* 登录方式 Tab（小尺寸） */
    .login-modes {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--divider);
      margin-bottom: 18px;
    }

    .mode-btn {
      padding: 6px 14px 7px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
      font-family: inherit;
      margin-bottom: -1px;
    }

    .mode-btn.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    /* 面板 */
    .panel { display: none; }
    .panel.active { display: block; }

    /* ── 紧凑字段系统 ── */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 10px;
      margin-bottom: 8px;
    }

    .form-grid .f-full { grid-column: 1 / -1; }

    .f {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .f lbl {
      display: block;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* 通用 select + input 同高度 */
    .f select, .f input {
      width: 100%;
      height: 34px;
      /* .f 是 column 方向的 flex 容器，输入框是 flex 项：
         默认 flex-shrink:1 会让上面的 height:34px 在容器被压缩时失效
         （验证码行就被压成过 17.6px，比同行的「获取」按钮矮一半）。
         flex:none 保证高度是硬约束，而不是"建议值"。 */
      flex: none;
      padding: 0 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--text);
      font-size: 12px;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
      font-family: inherit;
      appearance: none;
      -webkit-appearance: none;
    }

    .f select {
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23666660' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 10px center;
      padding-right: 28px;
      cursor: pointer;
    }

    .f input:focus, .f select:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(120,100,255,0.1);
    }

    .f input::placeholder { color: var(--text-dim); font-size: 12px; }

    /* 账号行：前缀+输入合体 */
    .account-row {
      display: flex;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 2px;
      overflow: hidden;
      transition: border-color 0.18s, box-shadow 0.18s;
    }

    .account-row:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(120,100,255,0.1);
    }

    .account-prefix {
      display: flex;
      align-items: center;
      padding: 0 9px;
      background: var(--surface3);
      border-right: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
      font-weight: 500;
    }

    .account-input {
      flex: 1;
      height: 100%;
      padding: 0 10px;
      background: var(--surface2);
      border: none;
      outline: none;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      min-width: 0;
    }

    .account-input::placeholder { color: var(--text-dim); }

    /* 验证码行 */
    .code-row {
      display: flex;
      gap: 7px;
      align-items: flex-end;
    }

    .code-row .f { flex: 1; }

    .btn-send {
      height: 34px;
      padding: 0 12px;
      flex-shrink: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--accent2);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.18s;
      font-family: inherit;
      margin-bottom: 0;
    }

    .btn-send:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(120,100,255,0.08);
    }

    .btn-send:disabled { color: var(--text-dim); cursor: default; }

    /* 密码强度条 */
    .pw-strength {
      display: flex;
      gap: 3px;
      margin-top: 4px;
    }

    .pw-bar {
      flex: 1;
      height: 2px;
      border-radius: 1px;
      background: var(--surface2);
      transition: background 0.3s;
    }

    /* 子 Tab（验证码/密码/注册） */
    .sub-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--divider);
    }

    .sub-tab {
      padding: 5px 12px 6px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
      font-family: inherit;
      margin-bottom: -1px;
    }

    .sub-tab.active {
      color: var(--accent2);
      border-bottom-color: var(--accent);
    }

    /* 主按钮 */
    .btn-primary {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      border: none;
      border-radius: 2px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      transition: opacity 0.18s, transform 0.15s;
      box-shadow: 0 3px 14px var(--accent-glow);
      font-family: inherit;
      letter-spacing: 0.3px;
    }

    .btn-primary:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.45; cursor: default; }

    /* 辅助链接 */
    .aux-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
    }

    .aux-links a, .aux-links button {
      font-size: 11px;
      color: var(--text-muted);
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: color 0.18s;
    }

    .aux-links a:hover, .aux-links button:hover { color: var(--accent2); }
    .aux-dot { color: var(--text-dim); }

    /* 提示 */
    .tip {
      font-size: 11px;
      padding: 7px 10px;
      border-radius: 2px;
      margin-bottom: 10px;
      display: none;
      line-height: 1.5;
    }

    .tip.success { background: rgba(52,211,153,0.08); color: var(--success); border: 1px solid rgba(52,211,153,0.18); }
    .tip.error   { background: rgba(248,113,113,0.08); color: var(--error);   border: 1px solid rgba(248,113,113,0.18); }
    .tip.show { display: block; }

    /* 二级展开区（滑入） */
    .sub-fields {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.25s ease, opacity 0.2s;
      opacity: 0;
    }

    .sub-fields.open {
      max-height: 200px;
      opacity: 1;
    }

    /* section 分隔 */
    .form-sep {
      height: 1px;
      background: var(--divider);
      margin: 10px 0;
    }

    /* 底部 */
    .footer {
      margin-top: auto;
      padding-top: 14px;
      text-align: center;
      font-size: 10px;
      color: var(--text-dim);
      line-height: 1.9;
    }

    .footer a { color: var(--text-muted); text-decoration: none; }
    .footer a:hover { color: var(--accent2); }

    /* ── 响应式 ── */
    @media (max-width: 640px) {
      .card { flex-direction: column; max-width: 440px; }
      .left { width: 100%; border-right: none; border-bottom: 1px solid var(--divider); padding: 20px 22px; }
      .qr-scene { display: none; }
      .left-sep { display: none; }
      .left-title { margin-bottom: 10px; }
      .platform-list { flex-direction: row; flex-wrap: wrap; }
      .platform-btn { flex: 1; min-width: 100px; }
      .right { padding: 24px 20px; }
      .form-grid { grid-template-columns: 1fr; }
    }

    /* ── 演示角色按钮（嵌入卡片内） ── */
    .dev-role-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 9px 14px;
      background: var(--surface);
      border: none;
      border-top: 1px solid var(--border);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      font-family: inherit;
      text-align: left;
      transition: background .12s;
    }
    .dev-role-btn:hover { background: var(--surface2); }
    .dev-role-btn span {
      font-size: 10px;
      font-weight: 400;
      color: var(--text-dim);
      font-family: monospace;
      letter-spacing: .3px;
    }
  </style>
</head>
<body>

<div class="layout">
  <div class="card">

    <!-- ══ 左侧：第三方登录 ══ -->
    <div class="left">
      <div class="left-title">第三方快捷登录</div>

      <!-- 二维码展示区 -->
      <div class="qr-scene" id="qr-scene">
        <div class="qr-frame" id="qr-frame">
          <div id="qr-placeholder-wrap">
            <svg class="qr-placeholder" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <rect x="5" y="5" width="30" height="30" rx="3" fill="none" stroke="currentColor" stroke-width="3"/>
              <rect x="12" y="12" width="16" height="16" rx="1" fill="currentColor"/>
              <rect x="65" y="5" width="30" height="30" rx="3" fill="none" stroke="currentColor" stroke-width="3"/>
              <rect x="72" y="12" width="16" height="16" rx="1" fill="currentColor"/>
              <rect x="5" y="65" width="30" height="30" rx="3" fill="none" stroke="currentColor" stroke-width="3"/>
              <rect x="12" y="72" width="16" height="16" rx="1" fill="currentColor"/>
              <rect x="42" y="5" width="6" height="6" fill="currentColor"/><rect x="52" y="5" width="6" height="6" fill="currentColor"/>
              <rect x="42" y="14" width="6" height="6" fill="currentColor"/><rect x="52" y="22" width="6" height="6" fill="currentColor"/>
              <rect x="42" y="30" width="6" height="6" fill="currentColor"/><rect x="5" y="42" width="6" height="6" fill="currentColor"/>
              <rect x="14" y="42" width="6" height="6" fill="currentColor"/><rect x="22" y="50" width="6" height="6" fill="currentColor"/>
              <rect x="5" y="58" width="6" height="6" fill="currentColor"/><rect x="42" y="42" width="6" height="6" fill="currentColor"/>
              <rect x="52" y="42" width="6" height="6" fill="currentColor"/><rect x="62" y="42" width="6" height="6" fill="currentColor"/>
              <rect x="42" y="52" width="6" height="6" fill="currentColor"/><rect x="62" y="52" width="6" height="6" fill="currentColor"/>
              <rect x="72" y="42" width="6" height="6" fill="currentColor"/><rect x="82" y="50" width="6" height="6" fill="currentColor"/>
              <rect x="72" y="58" width="6" height="6" fill="currentColor"/><rect x="52" y="62" width="6" height="6" fill="currentColor"/>
              <rect x="62" y="72" width="6" height="6" fill="currentColor"/><rect x="42" y="80" width="6" height="6" fill="currentColor"/>
              <rect x="52" y="72" width="6" height="6" fill="currentColor"/><rect x="82" y="62" width="6" height="6" fill="currentColor"/>
              <rect x="82" y="80" width="6" height="6" fill="currentColor"/><rect x="72" y="72" width="6" height="6" fill="currentColor"/>
            </svg>
          </div>
          <div class="qr-expired-mask" id="qr-expired" onclick="refreshCurrentQR()">
            <div class="qr-spin-icon"></div>
            <span>点击刷新二维码</span>
          </div>
        </div>
        <div class="qr-brand-label" id="qr-label"></div>
      </div>

      <div class="left-sep"></div>

      <div class="platform-list" id="platform-list">
        <!-- 由 JS 根据配置动态渲染 -->
      </div>
    </div>

    <!-- ══ 右侧：账号登录 ══ -->
    <div class="right">
      <div class="brand">
        <div class="brand-icon">🔐</div>
        <span class="brand-name">统一登录</span>
      </div>

      <!-- 第三方登录来源过渡横幅（从 OIDC 授权流程跳来时显示） -->
      <div id="oidc-banner" style="display:none;align-items:center;gap:10px;padding:11px 13px;margin-bottom:14px;border-radius:12px;background:var(--surface-2,#F5F5F7);border:1px solid var(--border,rgba(0,0,0,.08));">
        <div id="oidc-banner-icon" style="width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;flex:none;background:#F0F0F0;"></div>
        <div style="min-width:0;">
          <div style="font-size:13px;font-weight:600;line-height:1.4;">您正在登录 <span id="oidc-banner-name">应用</span></div>
          <div style="font-size:11.5px;color:var(--text-dim,#86868B);">登录后将返回该应用继续</div>
        </div>
      </div>

      <!-- 登录方式主 Tab -->
      <div class="login-modes">
        <button class="mode-btn active" onclick="switchMode('login')">账号登录</button>
        <button class="mode-btn" onclick="switchMode('register')">注册账号</button>
      </div>

      <!-- ══ 登录面板 ══ -->
      <div class="panel active" id="panel-login">
        <div id="tip-login" class="tip"></div>

        <!-- 子 Tab（验证码/密码） -->
        <div class="sub-tabs">
          <button class="sub-tab active" id="stab-code" onclick="switchLoginSub('code')">验证码</button>
          <button class="sub-tab" id="stab-pw" onclick="switchLoginSub('pw')">密码</button>
        </div>

        <!-- 账号输入：邮箱 / 手机号 / 用户名 / UID，自动识别 -->
        <div class="f" style="margin-bottom:8px;">
          <lbl id="acct-label">账号</lbl>
          <div class="account-row">
            <input class="account-input" id="acct-value" type="text" style="padding-left:12px;" placeholder="邮箱 / 手机号 / 用户名 / UID" autocomplete="username" />
          </div>
          <div id="acct-hint" style="font-size:11px;color:var(--text-dim);margin-top:4px;">验证码登录仅支持邮箱或手机号；密码登录四种均可</div>
        </div>

        <!-- 验证码子面板 -->
        <div id="sub-code">
          <div class="code-row">
            <div class="f">
              <lbl>验证码</lbl>
              <input type="text" id="login-code" placeholder="6 位验证码" maxlength="6" inputmode="numeric" />
            </div>
            <button class="btn-send" id="login-send" onclick="sendLoginCode()">获取</button>
          </div>
        </div>

        <!-- 密码子面板 -->
        <div id="sub-pw" style="display:none;">
          <div class="f">
            <lbl>密码</lbl>
            <input type="password" id="login-pass" placeholder="请输入密码" autocomplete="current-password" />
          </div>
        </div>

        <button class="btn-primary" onclick="doLogin()">登录</button>
        <button class="btn-primary" id="passkey-login-btn" onclick="doPasskeyLogin()"
          style="display:none;margin-top:8px;background:var(--surface2);color:var(--text);border:1px solid var(--border);">🔑 用 Passkey 登录</button>
        <div class="aux-links">
          <button onclick="switchMode('register')">注册账号</button>
          <span class="aux-dot">·</span>
          <a href="javascript:void 0" onclick="showForgotPassword()">忘记密码</a>
        </div>
      </div>

      <!-- ══ 注册面板 ══ -->
      <div class="panel" id="panel-register">
        <div id="tip-register" class="tip"></div>

        <div class="form-grid">
          <div class="f">
            <lbl>账号类型</lbl>
            <select id="reg-type" onchange="onRegTypeChange()">
              <option value="email">邮箱</option>
              <option value="phone">手机号</option>
            </select>
          </div>
          <div class="f" id="rf-domain">
            <lbl>账号所属域</lbl>
            <select id="reg-domain" onchange="onRegDomainChange()">
              <option value="">— 不限 —</option>
              <option value="@gmail.com">Gmail</option>
              <option value="@qq.com">QQ 邮箱</option>
              <option value="@163.com">网易</option>
              <option value="@outlook.com">Outlook</option>
              <option value="custom">自定义…</option>
            </select>
          </div>
          <div class="f" id="rf-dialcode" style="display:none;">
            <lbl>电话区号</lbl>
            <select id="reg-dialcode">
              <option value="+86">+86 中国大陆</option>
              <option value="+852">+852 香港</option>
              <option value="+853">+853 澳门</option>
              <option value="+886">+886 台湾</option>
              <option value="+1">+1 美国/加拿大</option>
              <option value="+44">+44 英国</option>
              <option value="+81">+81 日本</option>
            </select>
          </div>
        </div>

        <div class="sub-fields" id="reg-custom-domain-wrap">
          <div class="f f-full" style="margin-top:0;margin-bottom:8px;">
            <lbl>自定义域名</lbl>
            <input type="text" id="reg-custom-domain" placeholder="例：@company.com" />
          </div>
        </div>

        <div class="form-sep"></div>

        <div class="form-grid">
          <div class="f f-full">
            <lbl id="reg-acct-label">邮箱地址</lbl>
            <div class="account-row">
              <span class="account-prefix" id="reg-acct-prefix">邮箱</span>
              <input class="account-input" id="reg-acct" type="email" placeholder="请输入邮箱地址" />
            </div>
          </div>
          <div class="f">
            <lbl>显示名称</lbl>
            <input type="text" id="reg-name" placeholder="可选" />
          </div>
          <div class="f">
            <lbl>密码（≥6位）</lbl>
            <input type="password" id="reg-pass" placeholder="设置密码" oninput="pwStrength(this.value)" />
          </div>
          <div class="f f-full">
            <div class="pw-strength">
              <div class="pw-bar" id="pw-bar-1"></div><div class="pw-bar" id="pw-bar-2"></div>
              <div class="pw-bar" id="pw-bar-3"></div><div class="pw-bar" id="pw-bar-4"></div>
            </div>
          </div>
          <div class="f f-full">
            <lbl>确认密码</lbl>
            <input type="password" id="reg-pass2" placeholder="再次输入" />
          </div>
        </div>

        <button class="btn-primary" onclick="doRegister()">注册</button>
        <div class="aux-links">
          <button onclick="switchMode('login')">已有账号，去登录</button>
        </div>
      </div>

      <div class="footer">
        登录即代表同意 <a href="javascript:void 0" onclick="showDoc('terms')">服务条款</a> 与 <a href="javascript:void 0" onclick="showDoc('privacy')">隐私政策</a>
        <div id="dev-hint" style="display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">
          <div style="font-size:11px;color:var(--text-dim);line-height:1.6;margin-bottom:5px;">
            未配置 SSO 地址？请联系管理员在「环境变量」中设置 <code style="font-size:10px;opacity:.75;">BASE_URL</code>
          </div>
          <a href="#" id="dev-preview-link"
            style="font-size:12px;color:var(--text-muted);text-decoration:underline;text-underline-offset:2px;"
            onclick="toggleDevAccounts(event)">
            未接入 SSO？以演示账号进入（开发预览）
          </a>
          <div id="dev-accounts-panel" style="display:none;margin-top:8px;border:1px solid var(--border);border-radius:2px;overflow:hidden;text-align:left;">
            <div style="padding:6px 12px;font-size:10px;font-weight:700;color:var(--text-dim);background:var(--surface2);letter-spacing:.5px;text-transform:uppercase;">选择演示角色</div>
            <button class="dev-role-btn" onclick="devLogin('admin')">🛡️ 超级管理员 <span>admin@dev.local</span></button>
            <button class="dev-role-btn" onclick="devLogin('ops')">📋 运营管理员 <span>ops@dev.local</span></button>
            <button class="dev-role-btn" onclick="devLogin('user')">👤 普通用户 <span>user@dev.local</span></button>
            <button class="dev-role-btn" onclick="devLogin('vip')">👑 VIP 用户（500积分）<span>vip@dev.local</span></button>
          </div>
        </div>
      </div>

    </div>
  </div>

</div>

    github:    { label: 'GitHub',    mode: 'redirect', url: '/auth/github',    icon: `<svg width="13" height="13" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.49.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.52 2.34 1.08 2.91.83.09-.65.35-1.08.63-1.33-2.22-.25-4.56-1.11-4.56-4.95 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.56 9.56 0 0 1 12 6.8c.85.004 1.7.115 2.5.337 1.9-1.29 2.74-1.02 2.74-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.85-2.34 4.7-4.57 4.95.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10.01 10.01 0 0 0 22 12c0-5.52-4.48-10-10-10z"/></svg>`, bg: '#24292E', envKey: 'GITHUB_CLIENT_ID' },
    microsoft: { label: 'Microsoft', mode: 'redirect', url: '/auth/microsoft', icon: `<svg width="13" height="13" viewBox="0 0 24 24"><rect x="1" y="1" width="10" height="10" fill="#F25022"/><rect x="13" y="1" width="10" height="10" fill="#7FBA00"/><rect x="1" y="13" width="10" height="10" fill="#00A4EF"/><rect x="13" y="13" width="10" height="10" fill="#FFB900"/></svg>`, bg: '#fff', envKey: 'MICROSOFT_CLIENT_ID' },
    qq:        { label: 'QQ',        mode: 'redirect', url: '/auth/qq',        icon: `<svg width="13" height="13" viewBox="0 0 24 24" fill="white"><path d="M12 2C7.58 2 4 6.5 4 10.5c0 2.5 1 4.8 2.6 6.4-.3.7-.9 1.9-2.1 3.1 1.8-.2 3.4-1 4.5-1.8.9.3 1.9.5 3 .5s2.1-.2 3-.5c1.1.8 2.7 1.6 4.5 1.8-1.2-1.2-1.8-2.4-2.1-3.1C19 15.3 20 13 20 10.5 20 6.5 16.42 2 12 2z"/></svg>`, bg: '#12B7F5', envKey: 'QQ_APP_ID' },
  };

  // ── 从后端获取已配置的平台列表，动态渲染按钮 ──
  // 平台中文短名（多主体时与主体名拼成「微信 · A公司」）
  const PLATFORM_ZH = {
    wechat:'微信', wecom:'企业微信', feishu:'飞书', dingtalk:'钉钉', github:'GitHub',
    microsoft:'Microsoft', qq:'QQ', google:'Google', apple:'Apple',
    douyin:'抖音', kuaishou:'快手', xiaohongshu:'小红书', bilibili:'Bilibili',
  };
  const QR_PLATFORMS = ['wechat', 'wecom'];

  // 全部「登录方式」：每个渠道的默认主体 + 各数据库额外主体，一主体一按钮
  let LOGIN_METHODS = [];
  let currentMethodIdx = 0;

  function methodName(m) {
    const base = PLATFORM_ZH[m.platform] || (PLATFORMS[m.platform]?.label) || m.platform;
    return m.label ? `${base} · ${m.label}` : base;
  }

  async function renderPlatformList() {
    const list = document.getElementById('platform-list');
    if (!list) return;

    let methods = [];
    try {
      const res = await fetch('/api/public/login-methods');
      if (res.ok) methods = (await res.json()).methods || [];
    } catch(_) {}

    // 接口不通（file://）时兜底：微信 + 企业微信 默认主体
    if (!methods.length) {
      methods = [{ platform:'wechat', instance_id:null, label:'' }, { platform:'wecom', instance_id:null, label:'' }];
    }

    // 按平台顺序稳定排序（同平台内保持后端顺序：默认主体在前，额外主体随后）
    const order = ['wechat','wecom','feishu','dingtalk','github','microsoft','qq','google','apple','douyin','kuaishou','xiaohongshu','bilibili'];
    methods.sort((a,b) => (order.indexOf(a.platform) - order.indexOf(b.platform)));
    LOGIN_METHODS = methods;

    list.innerHTML = methods.map((m, i) => {
      const key = m.platform;
      const p = PLATFORMS[key] || { icon:'', bg:'#888' };
      const brand = (window.BRAND_ICONS && BRAND_ICONS[key]) || '';
      const iconBg = brand ? `background:#fff;border:1px solid #E8E8E8;` : `background:${p.bg};`;
      return `<button class="platform-btn ${i===0?'active':''}" id="pb-m${i}" onclick="selectMethod(${i})">
        <div class="p-icon" style="${iconBg}">${brand || p.icon}</div>
        <span class="p-name">${methodName(m)}</span>
        <span class="p-status">当前</span>
      </button>`;
    }).join('');

    if (methods.length) selectMethod(0);
  }

  const LABEL_ICONS = {
    wechat: `<svg width="14" height="14" viewBox="0 0 24 24" fill="#07C160"><path d="M8.69 11.52c-.57 0-1.03-.46-1.03-1.03s.46-1.03 1.03-1.03c.57 0 1.03.46 1.03 1.03s-.46 1.03-1.03 1.03zm4.14 0c-.57 0-1.03-.46-1.03-1.03s.46-1.03 1.03-1.03c.57 0 1.03.46 1.03 1.03s-.46 1.03-1.03 1.03zm-1.32-9.49C5.58 2.03 1 6.11 1 11.26c0 2.88 1.37 5.45 3.53 7.23-.14.51-.51 1.87-.59 2.17-.1.37.14.37.28.27.11-.08 1.71-1.14 2.4-1.62.86.22 1.76.34 2.69.34 5.93 0 10.69-4.08 10.69-9.39 0-5.15-4.8-9.23-10.69-9.23h.2z"/></svg>`,
    wecom: `<svg width="14" height="14" viewBox="0 0 24 24" fill="#1677FF"><path d="M9.5 5.5c-2.76 0-5 2.24-5 5s2.24 5 5 5c.55 0 1.08-.09 1.58-.25.15 1.43.93 2.67 2.08 3.44-1.14.53-2.4.81-3.66.81-4.97 0-9-4.03-9-9s4.03-9 9-9 9 4.03 9 9c0 .66-.07 1.3-.2 1.93-.48-.25-1.02-.38-1.58-.38-.53 0-1.04.12-1.5.33C14.9 10.8 14.5 8 9.5 5.5zm8.25 7.75c-1.38 0-2.5 1.12-2.5 2.5s1.12 2.5 2.5 2.5 2.5-1.12 2.5-2.5-1.12-2.5-2.5-2.5z"/></svg>`,
  };

  let currentPlatform = 'wechat';
  let qrExpireTimer = null;

  // 拼登录跳转地址：/auth/<平台>[?inst=<主体id>][&next=]
  function methodAuthUrl(m) {
    const params = new URLSearchParams();
    if (m.instance_id) params.set('inst', m.instance_id);
    const nx = safeNext();
    if (nx) params.set('next', nx);
    const q = params.toString();
    return '/auth/' + m.platform + (q ? '?' + q : '');
  }

  // ── 登录方式切换（按主体）──
  function selectMethod(idx) {
    const m = LOGIN_METHODS[idx];
    if (!m) return;
    const key = m.platform;

    // 非扫码平台：直接跳授权（带 inst，服务端据此选对应主体的凭证）
    if (!QR_PLATFORMS.includes(key)) {
      window.location.href = methodAuthUrl(m);
      return;
    }

    // 扫码平台（微信 / 企业微信）：切到该主体的二维码
    currentMethodIdx = idx;
    document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('pb-m' + idx);
    if (btn) btn.classList.add('active');
    currentPlatform = key;

    document.getElementById('qr-label').innerHTML =
      ((window.BRAND_ICONS && BRAND_ICONS[key]) || LABEL_ICONS[key] || '') + ' ' + methodName(m);

    clearTimeout(qrExpireTimer);
    document.getElementById('qr-expired')?.classList.remove('show');

    const qr = m.qr || {};
    if (key === 'wechat') renderWechatQR(qr);
    else if (key === 'wecom') renderWecomQR(qr);
  }

  function refreshCurrentQR() {
    document.getElementById('qr-expired')?.classList.remove('show');
    selectMethod(currentMethodIdx);
  }

  // ── 微信网页扫码（WxLogin JS-SDK）——用该主体的 appid/redirect ──
  function renderWechatQR(qr) {
    const frame = document.getElementById('qr-frame');
    frame.innerHTML = '';
    const appid = qr.appid || '';
    if (!appid) {
      showQRPlaceholder('该主体尚未配置<br>WECHAT_APP_ID');
      return;
    }
    const redirectUri = encodeURIComponent(qr.redirect || (location.origin + '/auth/wechat/callback'));
    loadScript('https://res.wx.qq.com/connect/zh_CN/htmledition/js/wxLogin.js', () => {
      new window.WxLogin({
        self_redirect: false,
        id: 'qr-frame',
        appid,
        scope: 'snsapi_login',
        redirect_uri: redirectUri,
        state: genState(),
        style: 'black',
      });
      startExpireTimer(300);
    });
  }

  // ── 企业微信扫码（wwLogin JS-SDK）——用该主体的 corpid/agentid/redirect ──
  function renderWecomQR(qr) {
    const frame = document.getElementById('qr-frame');
    frame.innerHTML = '';
    const appid = qr.appid || '';      // 企业微信 CorpID
    const agentid = qr.agentid || '';
    if (!appid || !agentid) {
      showQRPlaceholder('该主体尚未配置<br>WECOM_CORP_ID / AGENT_ID');
      return;
    }
    const redirectUri = encodeURIComponent(qr.redirect || (location.origin + '/auth/wecom/callback'));
    loadScript('https://wwcdn.weixin.net.cn/node/wework/wwopen/js/libs/wwLogin-1.2.7.js', () => {
      new window.WwLogin({
        id: 'qr-frame',
        appid,
        agentid,
        redirect_uri: redirectUri,
        state: genState(),
        lang: 'zh',
      });
      startExpireTimer(300);
    });
  }

  // ── 工具函数 ──
  function showQRPlaceholder(msg) {
    document.getElementById('qr-frame').innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px;text-align:center;">
        <svg width="76" height="76" viewBox="0 0 100 100" style="opacity:.12;color:var(--text);" xmlns="http://www.w3.org/2000/svg">
          <rect x="5" y="5" width="30" height="30" rx="3" fill="none" stroke="currentColor" stroke-width="3"/>
          <rect x="12" y="12" width="16" height="16" rx="1" fill="currentColor"/>
          <rect x="65" y="5" width="30" height="30" rx="3" fill="none" stroke="currentColor" stroke-width="3"/>
          <rect x="72" y="12" width="16" height="16" rx="1" fill="currentColor"/>
          <rect x="5" y="65" width="30" height="30" rx="3" fill="none" stroke="currentColor" stroke-width="3"/>
          <rect x="12" y="72" width="16" height="16" rx="1" fill="currentColor"/>
          <rect x="42" y="5" width="6" height="6" fill="currentColor"/><rect x="52" y="5" width="6" height="6" fill="currentColor"/>
          <rect x="42" y="42" width="6" height="6" fill="currentColor"/><rect x="62" y="52" width="6" height="6" fill="currentColor"/>
        </svg>
        <p style="font-size:11px;color:var(--text-muted);line-height:1.6;">${msg}</p>
      </div>`;
  }

  function loadScript(src, cb) {
    if (document.querySelector(`script[src="${src}"]`)) { cb?.(); return; }
    const s = document.createElement('script');
    s.src = src; s.onload = cb;
    document.head.appendChild(s);
  }

  function genState() {
    return Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  function startExpireTimer(sec) {
    clearTimeout(qrExpireTimer);
    qrExpireTimer = setTimeout(() => {
      document.getElementById('qr-expired')?.classList.add('show');
    }, sec * 1000);
  }

  // ── 右侧：主 Tab（登录/注册） ──
  function switchMode(m) {
    ['login','register'].forEach((n,i) => {
      document.getElementById('panel-'+n).classList.toggle('active', n===m);
      document.querySelectorAll('.login-modes .mode-btn')[i].classList.toggle('active', n===m);
    });
  }

  // ── 登录子Tab（验证码/密码） ──
  function switchLoginSub(m) {
    document.getElementById('sub-code').style.display = m==='code' ? 'block' : 'none';
    document.getElementById('sub-pw').style.display   = m==='pw'   ? 'block' : 'none';
    document.getElementById('stab-code').classList.toggle('active', m==='code');
    document.getElementById('stab-pw').classList.toggle('active',   m==='pw');
  }

  // 账号标识符类型判断（前端只用于验证码走邮箱还是短信；真正的解析在后端）
  const isEmailStr = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  const isPhoneStr = v => /^1[3-9]\d{9}$/.test(v);

  // ── 邮箱域名策略：让「账号所属域」下拉框真实反映后端配置 ──
  // v3.3.2 之前这两个下拉框纯粹是输入辅助（帮你把 @gmail.com 拼到输入框后面），
  // 后端没有任何校验，管理员以为配了限制其实并没有。现在选项由后端策略决定，
  // 且后端会真正拦截——前端这里只是提前告知，不是安全边界。
  async function initDomainPolicy() {
    let policy = { mode: 'off', domains: [] };
    try {
      const r = await fetch('/api/public/email-domain-policy');
      if (r.ok) policy = await r.json();
    } catch (_) { return; }          // 拿不到就保持原样，不影响登录
    if (policy.mode === 'off') return;

    [['acct-domain', 'domain-policy-hint'], ['reg-domain', 'reg-domain-policy-hint']].forEach(([selId, hintId]) => {
      const sel = document.getElementById(selId);
      if (!sel) return;

      if (policy.mode === 'whitelist') {
        // 只能选允许的域，不给「不限」和「自定义」
        sel.innerHTML = policy.domains
          .map(d => `<option value="@${d}">@${d}</option>`).join('');
      } else {
        // 黑名单：保留原有选项，但把被禁的域摘掉
        [...sel.options].forEach(o => {
          const d = (o.value || '').replace(/^@/, '').toLowerCase();
          if (d && d !== 'custom' && policy.domains.some(b => d === b || d.endsWith('.' + b))) o.remove();
        });
      }

      if (!document.getElementById(hintId)) {
        const hint = document.createElement('div');
        hint.id = hintId;
        hint.style.cssText = 'font-size:11px;margin-top:4px;line-height:1.5;color:' +
          (policy.mode === 'whitelist' ? 'var(--brand,#0071E3)' : 'var(--warn,#FF9500)');
        hint.textContent = policy.mode === 'whitelist'
          ? `仅限 ${policy.domains.map(d => '@' + d).join('、')} 邮箱注册`
          : `以下邮箱域已被禁用：${policy.domains.map(d => '@' + d).join('、')}`;
        sel.parentElement.appendChild(hint);
      }
    });
  }
  initDomainPolicy();

  // ── 注册面板：账号类型切换 ──
  function onRegTypeChange() {
    const type = document.getElementById('reg-type').value;
    const isEmail = type === 'email';
    document.getElementById('rf-domain').style.display   = isEmail ? '' : 'none';
    document.getElementById('rf-dialcode').style.display = isEmail ? 'none' : '';
    if (!isEmail) document.getElementById('reg-custom-domain-wrap').classList.remove('open');
    const inp = document.getElementById('reg-acct');
    document.getElementById('reg-acct-label').textContent  = isEmail ? '邮箱地址' : '手机号';
    document.getElementById('reg-acct-prefix').textContent = isEmail ? '邮箱' : '手机';
    inp.type        = isEmail ? 'email' : 'tel';
    inp.placeholder = isEmail ? '请输入邮箱地址' : '请输入手机号';
    inp.maxLength   = isEmail ? 254 : 11;
  }

  function onRegDomainChange() {
    document.getElementById('reg-custom-domain-wrap').classList.toggle('open',
      document.getElementById('reg-domain').value === 'custom');
  }

  // ── 提示 ──
  function showTip(panel, type, msg) {
    const el = document.getElementById('tip-'+panel);
    el.className = 'tip' + (type?' '+type:'') + (msg?' show':'');
    el.textContent = msg;
  }

  // ── 倒计时 ──
  function countdown(btnId, s) {
    const btn = document.getElementById(btnId);
    btn.disabled = true;
    const orig = btn.textContent;
    let left = s;
    const iv = setInterval(() => {
      btn.textContent = left + 's'; left--;
      if (left < 0) { clearInterval(iv); btn.disabled = false; btn.textContent = orig; }
    }, 1000);
  }

  // ── 发送验证码（自动识别邮箱 / 手机号）──
  async function sendLoginCode() {
    const val = document.getElementById('acct-value').value.trim();
    const isEmail = isEmailStr(val), isPhone = isPhoneStr(val);
    if (!isEmail && !isPhone) return showTip('login','error','验证码登录请输入邮箱或手机号（用户名/UID 请用密码登录）');
    const btn = document.getElementById('login-send');
    btn.disabled = true; btn.textContent = '…';
    try {
      const r = await fetch(isEmail?'/api/email/send-code':'/api/sms/send', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(isEmail?{email:val}:{phone:val})});
      const d = await r.json(); if (!r.ok) throw new Error(d.error);
      showTip('login','success','✓ 验证码已发送'); countdown('login-send', 60);
    } catch(e) { showTip('login','error',e.message||'发送失败'); btn.disabled=false; btn.textContent='获取'; }
  }

  // ── 登录提交 ──
  async function doLogin() {
    const val  = document.getElementById('acct-value').value.trim();
    const isPw = document.getElementById('sub-pw').style.display !== 'none';
    if (!val) return showTip('login','error','请填写账号');
    try {
      let url, body;
      if (isPw) {
        // 密码登录：账号可以是邮箱 / 手机号 / 用户名 / UID，后端统一解析
        const pass = document.getElementById('login-pass').value;
        if (!pass) return showTip('login','error','请填写密码');
        url = '/api/account/login';
        body = { account: val, password: pass };
      } else {
        // 验证码登录：只能是邮箱或手机号（验证码要有下发渠道）
        const code = document.getElementById('login-code').value.trim();
        if (!code) return showTip('login','error','请填写验证码');
        if (isEmailStr(val))      { url = '/api/email/verify-code'; body = { email: val, code }; }
        else if (isPhoneStr(val)) { url = '/api/sms/verify';        body = { phone: val, code }; }
        else return showTip('login','error','验证码登录仅支持邮箱或手机号，用户名/UID 请用密码登录');
      }
      const r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const d = await r.json(); if (!r.ok) throw new Error(d.error);
      if (d.twofa_required) return show2faLogin(d.twofa_token);   // 开了 2FA → 进二段
      redirect(d.token, d.user);
    } catch(e) { showTip('login','error',e.message||'登录失败'); }
  }

  // ── 忘记密码 ──
  function showForgotPassword() {
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;';
    ov.innerHTML = `<div style="background:#fff;border-radius:14px;max-width:380px;width:100%;padding:24px;box-shadow:0 8px 40px rgba(0,0,0,.25);">
      <div style="font-size:16px;font-weight:700;color:#1D1D1F;margin-bottom:6px;">找回密码</div>
      <div style="font-size:12.5px;color:#86868B;line-height:1.6;margin-bottom:14px;">输入绑定了邮箱或手机号的账号，我们会发送验证码。</div>
      <input id="fp-account" placeholder="邮箱 / 手机号 / 用户名 / UID" style="width:100%;height:38px;padding:0 10px;border:1px solid #D2D2D7;border-radius:9px;outline:none;font-size:13px;margin-bottom:8px;"/>
      <div style="display:flex;gap:6px;margin-bottom:8px;">
        <input id="fp-code" placeholder="验证码" inputmode="numeric" maxlength="6" style="flex:1;height:38px;padding:0 10px;border:1px solid #D2D2D7;border-radius:9px;outline:none;font-size:13px;letter-spacing:4px;font-family:monospace;"/>
        <button id="fp-send" class="btn" style="white-space:nowrap;font-size:12px;" onclick="fpSend()">获取验证码</button>
      </div>
      <input id="fp-newpw" type="password" placeholder="新密码（至少 8 位）" style="width:100%;height:38px;padding:0 10px;border:1px solid #D2D2D7;border-radius:9px;outline:none;font-size:13px;margin-bottom:8px;"/>
      <div id="fp-tip" style="font-size:12px;min-height:16px;margin-bottom:6px;"></div>
      <div style="display:flex;gap:8px;">
        <button class="btn" style="flex:1;" onclick="this.closest('div[style*=fixed]').remove()">取消</button>
        <button class="btn-primary" style="flex:1;border:none;border-radius:9px;cursor:pointer;" onclick="fpReset()">重置密码</button>
      </div>
    </div>`;
    document.body.appendChild(ov);
    ov.querySelector('#fp-account').focus();
  }
  function fpTip(type, msg) { const el = document.getElementById('fp-tip'); if (el) { el.textContent = msg; el.style.color = type==='error'?'#FF3B30':'#5CB85C'; } }
  async function fpSend() {
    const account = document.getElementById('fp-account').value.trim();
    if (!account) return fpTip('error','请先输入账号');
    const btn = document.getElementById('fp-send'); btn.disabled = true; btn.textContent = '…';
    try {
      const r = await fetch('/api/public/forgot-password/send', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ account }) });
      const d = await r.json();
      fpTip('success', d.message || '验证码已发送');
      countdown('fp-send', 60);
    } catch (_) { fpTip('error','发送失败'); btn.disabled=false; btn.textContent='获取验证码'; }
  }
  async function fpReset() {
    const account = document.getElementById('fp-account').value.trim();
    const code = document.getElementById('fp-code').value.trim();
    const new_password = document.getElementById('fp-newpw').value;
    if (!account || !code || !new_password) return fpTip('error','请填完整');
    if (new_password.length < 8) return fpTip('error','新密码至少 8 位');
    try {
      const r = await fetch('/api/public/forgot-password/reset', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ account, code, new_password }) });
      const d = await r.json(); if (!r.ok) throw new Error(d.error);
      document.querySelector('div[style*="z-index: 9999"]')?.remove();
      showTip('login','success','✓ 密码已重置，请用新密码登录');
    } catch (e) { fpTip('error', e.message || '重置失败'); }
  }

  // ── 服务条款 / 隐私政策 弹窗 ──
  async function showDoc(key) {
    let doc;
    try {
      const r = await fetch('/api/public/document/' + key);
      doc = await r.json();
      if (!r.ok) throw 0;
    } catch (_) { showTip('login','error','文档加载失败'); return; }
    // 管理员填了外部链接 → 直接新标签打开，不弹富文本
    if (doc.link && /^https?:\/\//i.test(doc.link)) { window.open(doc.link, '_blank', 'noopener'); return; }
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;';
    const body = (doc.content && doc.content.trim()) ? doc.content : '<p style="color:#888;">管理员尚未设置该文档内容。</p>';
    ov.innerHTML = `<div style="background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.25);">
      <div style="padding:16px 22px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;">
        <div style="font-size:16px;font-weight:700;color:#1D1D1F;">${(doc.title||'').replace(/[<>]/g,'')}</div>
        <button style="border:none;background:none;font-size:20px;cursor:pointer;color:#888;" onclick="this.closest('div[style*=fixed]').remove()">×</button>
      </div>
      <div style="padding:22px;overflow:auto;font-size:14px;line-height:1.85;color:#333;">${body}</div>
    </div>`;
    ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
    document.body.appendChild(ov);
  }

  // ── Passkey 登录（无密码）──
  async function doPasskeyLogin() {
    if (!window.WebAuthnGlue || !WebAuthnGlue.supported()) { showTip('login','error','当前浏览器不支持 Passkey'); return; }
    try {
      const opts = await (await fetch('/api/passkey/login-options', { method:'POST', headers:{'Content-Type':'application/json'} })).json();
      let assertion;
      try { assertion = await WebAuthnGlue.startAuthentication(opts); }
      catch (e) { if (e.name === 'NotAllowedError') return; throw e; }
      const r = await fetch('/api/passkey/login-verify', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ credential: assertion }) });
      const d = await r.json(); if (!r.ok) throw new Error(d.error);
      redirect(d.token, d.user);
    } catch (e) { showTip('login','error', e.message || 'Passkey 登录失败'); }
  }

  // ── 2FA 登录第二步：动态浮层（避免改动主表单）──
  function show2faLogin(twofaToken) {
    let useRecovery = false;
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;';
    ov.innerHTML = `
      <div style="background:#fff;border-radius:14px;max-width:360px;width:100%;padding:26px 24px;box-shadow:0 8px 40px rgba(0,0,0,.2);">
        <div style="font-size:16px;font-weight:700;color:#1D1D1F;margin-bottom:4px;">两步验证</div>
        <div id="tfa-desc" style="font-size:12.5px;color:#86868B;margin-bottom:16px;">请输入身份验证器 App 里的 6 位动态验证码</div>
        <input id="tfa-code" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位验证码"
          style="width:100%;height:42px;font-size:18px;letter-spacing:6px;text-align:center;border:1px solid #D2D2D7;border-radius:9px;outline:none;font-family:monospace;" maxlength="20"/>
        <div id="tfa-err" style="color:#FF3B30;font-size:12px;margin-top:8px;min-height:16px;"></div>
        <button id="tfa-ok" style="width:100%;height:42px;margin-top:8px;border:none;border-radius:9px;background:#5A8A00;color:#fff;font-size:14px;font-weight:600;cursor:pointer;">验证并登录</button>
        <div style="display:flex;justify-content:space-between;margin-top:12px;font-size:12px;">
          <a id="tfa-toggle" href="javascript:void 0" style="color:#5A8A00;">用恢复码登录</a>
          <a id="tfa-cancel" href="javascript:void 0" style="color:#86868B;">取消</a>
        </div>
      </div>`;
    document.body.appendChild(ov);
    const codeEl = ov.querySelector('#tfa-code'), errEl = ov.querySelector('#tfa-err');
    codeEl.focus();

    ov.querySelector('#tfa-toggle').onclick = () => {
      useRecovery = !useRecovery;
      ov.querySelector('#tfa-desc').textContent = useRecovery ? '请输入一个恢复码（形如 3f9a-8c2e）' : '请输入身份验证器 App 里的 6 位动态验证码';
      ov.querySelector('#tfa-toggle').textContent = useRecovery ? '用动态验证码登录' : '用恢复码登录';
      codeEl.placeholder = useRecovery ? '恢复码' : '6 位验证码';
      codeEl.value = ''; codeEl.style.letterSpacing = useRecovery ? '2px' : '6px'; codeEl.focus();
    };
    ov.querySelector('#tfa-cancel').onclick = () => ov.remove();

    async function submit() {
      const v = codeEl.value.trim();
      if (!v) { errEl.textContent = '请输入验证码'; return; }
      const btn = ov.querySelector('#tfa-ok'); btn.disabled = true; btn.textContent = '验证中…';
      try {
        const body = useRecovery ? { twofa_token: twofaToken, recovery_code: v } : { twofa_token: twofaToken, code: v };
        const r = await fetch('/api/2fa/login-verify', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
        const d = await r.json(); if (!r.ok) throw new Error(d.error);
        if (typeof d.recoveryCodesLeft === 'number' && d.recoveryCodesLeft <= 2)
          try { localStorage.setItem('sso_recovery_warn', d.recoveryCodesLeft); } catch(_) {}
        ov.remove();
        redirect(d.token, d.user);
      } catch(e) { errEl.textContent = e.message || '验证失败'; btn.disabled = false; btn.textContent = '验证并登录'; }
    }
    ov.querySelector('#tfa-ok').onclick = submit;
    codeEl.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  }

  // ── 注册提交 ──
  async function doRegister() {
    const type  = document.getElementById('reg-type').value;
    const val   = document.getElementById('reg-acct').value.trim();
    const name  = document.getElementById('reg-name').value.trim();
    const pass  = document.getElementById('reg-pass').value;
    const pass2 = document.getElementById('reg-pass2').value;
    const isEmail = type === 'email';
    if (!val)          return showTip('register','error','请填写账号');
    if (!pass)         return showTip('register','error','请设置密码');
    if (pass !== pass2) return showTip('register','error','两次密码不一致');
    if (pass.length<6) return showTip('register','error','密码至少 6 位');
    try {
      const body = isEmail ? {email:val,name,password:pass} : {phone:val,name,password:pass};
      const r = await fetch('/api/email/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const d = await r.json(); if (!r.ok) throw new Error(d.error);
      redirect(d.token, d.user);
    } catch(e) { showTip('register','error',e.message||'注册失败'); }
  }

  // 登录后的去向：?next= 指定则跳回去（用于 OIDC 授权页登录后继续授权）。
  // 只接受站内相对路径，防止被构造成开放重定向把 token 带去外站。
  function safeNext() {
    const n = new URLSearchParams(location.search).get('next');
    if (!n || !n.startsWith('/') || n.startsWith('//')) return null;
    return n;
  }

  // 从 next（授权页地址）里解析出 client_id，拉应用名/图标显示「您正在登录 xxx」过渡横幅
  async function showOidcBanner(nx) {
    try {
      const qs = nx.includes('?') ? nx.slice(nx.indexOf('?') + 1) : '';
      const cid = new URLSearchParams(qs).get('client_id');
      if (!cid) return;
      const r = await fetch('/oauth/app-info?client_id=' + encodeURIComponent(cid));
      if (!r.ok) return;
      const d = await r.json();
      if (!d.app) return;
      const isImg = s => /^https?:\/\//i.test(s || '');
      const iconEl = document.getElementById('oidc-banner-icon');
      iconEl.style.background = d.app.icon_bg || '#F0F0F0';
      if (isImg(d.app.icon)) {
        const img = document.createElement('img');
        img.src = d.app.icon; img.alt = '';
        img.style.cssText = 'width:100%;height:100%;object-fit:cover;';
        iconEl.innerHTML = ''; iconEl.appendChild(img);
      } else {
        iconEl.textContent = d.app.icon || '📦';
      }
      document.getElementById('oidc-banner-name').textContent = d.app.name || '应用';
      document.getElementById('oidc-banner').style.display = 'flex';
    } catch (_) {}
  }

  function redirect(token, user) {
    localStorage.setItem('sso_token', token);
    localStorage.setItem('sso_user', JSON.stringify(user));
    const next = safeNext();
    // 有 next 时跳过登录成功中间页，直接回到原流程
    if (next) { window.location.replace(next); return; }
    window.location.href = '/login-success.html?token='+token+'&name='+encodeURIComponent(user.name||'');
  }

  function pwStrength(v) {
    const s=v.length>=12?4:v.length>=8?3:v.length>=6?2:v.length>0?1:0;
    const c=['','#EF4444','#F59E0B','#3B82F6','#10B981'];
    [1,2,3,4].forEach(i=>document.getElementById('pw-bar-'+i).style.background=i<=s?c[s]:'var(--surface2)');
  }

  const urlErr = new URLSearchParams(location.search).get('error');
  if (urlErr) {
    const msgs={wechat_failed:'微信登录失败',wecom_failed:'企业微信登录失败',feishu_failed:'飞书登录失败',dingtalk_failed:'钉钉登录失败',douyin_failed:'抖音登录失败',kuaishou_failed:'快手登录失败',xiaohongshu_failed:'小红书登录失败',bilibili_failed:'Bilibili 登录失败',google_failed:'Google 登录失败',apple_failed:'Apple 登录失败',account_disabled:'账号已停用，请联系管理员',invalid_state:'登录已过期，请重新发起'};
    showTip('login','error',msgs[urlErr]||('登录失败：'+urlErr));
  }

  document.addEventListener('DOMContentLoaded', async () => {
    renderPlatformList();

    // 第三方登录若用户开了 2FA，会带 ?tfa= 跳回这里，直接弹二段验证浮层
    const tfaToken = new URLSearchParams(location.search).get('tfa');
    if (tfaToken) show2faLogin(tfaToken);

    // 浏览器支持 Passkey 才显示按钮
    if (window.WebAuthnGlue && WebAuthnGlue.supported()) {
      const pb = document.getElementById('passkey-login-btn');
      if (pb) pb.style.display = '';
    }

    // 若带了 next（OIDC 授权流程），先把它存进服务端 session，
    // 这样连扫码登录（不经过 /auth/<平台> 入口）回来后也能跳回授权页
    const _nx = safeNext();
    if (_nx) {
      try { await fetch('/auth/stash-next?next=' + encodeURIComponent(_nx), { credentials: 'include' }); } catch (_) {}
      showOidcBanner(_nx);
    }

    const isFileProtocol = location.protocol === 'file:';
    const isLocalhost    = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    const hasRealToken   = !!localStorage.getItem('sso_token');
    const serverSaysNo   = window.__SETUP_DONE__ === false;
    const shouldShowHint = serverSaysNo || isFileProtocol || (isLocalhost && !hasRealToken);

    if (shouldShowHint) {
      const hint = document.getElementById('dev-hint');
      if (hint) hint.style.display = 'block';
    }

    // 已有有效 token：无需重新登录，直接进入控制台
    if (hasRealToken) {
      try {
        const token = localStorage.getItem('sso_token');
        const res = await fetch('/api/user/me', { headers: { Authorization: `Bearer ${token}` } });
        if (res.ok) {
          window.location.replace(safeNext() || '/dashboard.html');
          return;
        } else {
          // token 已失效，清除后留在登录页
          localStorage.removeItem('sso_token');
          localStorage.removeItem('sso_user');
        }
      } catch (_) {
        // 网络错误：不强制跳转，留在登录页让用户手动重试
      }
    }
  });

  // ── 展开/收起角色选择 ──
  function toggleDevAccounts(e) {
    e.preventDefault();
    const panel = document.getElementById('dev-accounts-panel');
    const link  = document.getElementById('dev-preview-link');
    if (!panel) return;
    const open = panel.style.display === 'none' || panel.style.display === '';
    panel.style.display = open ? 'block' : 'none';
    link.textContent = open ? '收起 ↑' : '未接入 SSO？以演示账号进入（开发预览）';
  }

  // ── 模拟登录：纯前端，写入演示 session ──
  const DEV_ACCOUNTS = {
    admin: { id:'dev-admin', uid_seq:1, name:'演示管理员', email:'admin@dev.local', role:'admin', admin_level:1, user_level:1, points:500 },
    ops:   { id:'dev-ops',   uid_seq:2, name:'演示运营',   email:'ops@dev.local',   role:'admin', admin_level:2, user_level:1, points:200 },
    user:  { id:'dev-user',  uid_seq:3, name:'演示用户',   email:'user@dev.local',  role:'user',  admin_level:null, user_level:4, points:100 },
    vip:   { id:'dev-vip',   uid_seq:4, name:'演示VIP',    email:'vip@dev.local',   role:'user',  admin_level:null, user_level:1, points:500 },
  };

  function devLogin(role) {
    const acc = DEV_ACCOUNTS[role];
    if (!acc) return;
    localStorage.setItem('_dev_session', JSON.stringify(acc));
    localStorage.removeItem('sso_token');
    localStorage.removeItem('sso_user');
    window.location.href = '/dashboard';
  }
</script>
