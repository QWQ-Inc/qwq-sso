<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>门禁扫码终端 · QWQ SSO</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --txt:#e2e8f0; --mut:#94a3b8; --line:#334155; --accent:#3b82f6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif; background:var(--bg); color:var(--txt); min-height:100vh; }
  .wrap { max-width:560px; margin:0 auto; padding:18px 16px 40px; }
  h1 { font-size:20px; margin:8px 0 4px; }
  .sub { color:var(--mut); font-size:13px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:13px; color:var(--mut); margin:10px 0 5px; }
  input, select { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:#0b1220; color:var(--txt); font-size:15px; }
  button { width:100%; padding:13px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:16px; font-weight:600; cursor:pointer; margin-top:12px; }
  button.ghost { background:#334155; }
  #video { width:100%; border-radius:12px; background:#000; aspect-ratio:1/1; object-fit:cover; display:none; }
  #scanBox.on #video { display:block; }
  .result { display:none; position:fixed; inset:0; z-index:50; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .result.show { display:flex; }
  .result.allow { background:#064e3b; }
  .result.deny { background:#7f1d1d; }
  .result.wait { background:#78350f; }
  .result .icon { font-size:96px; }
  .result .big { font-size:34px; font-weight:800; margin:8px 0; }
  .result .who { font-size:20px; opacity:.95; }
  .result .reason { font-size:15px; opacity:.8; margin-top:8px; }
  .row { display:flex; gap:10px; } .row > * { flex:1; }
  .hint { font-size:12px; color:var(--mut); margin-top:8px; line-height:1.6; }
  .err { color:#fca5a5; font-size:13px; margin-top:8px; min-height:18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🚪 门禁扫码终端</h1>
  <div class="sub">把这台设备（平板/旧手机/电脑）当作门口的扫码机：选门 → 扫用户出示的动态二维码 → 自动判定开门。</div>

  <div class="card" id="setup">
    <label>服务器地址（默认当前站点，一般不用改）</label>
    <input id="base" placeholder="https://qwqsso.zeabur.app">
    <label>门禁 API Key（sk_live_ 需在后台给本机出口 IP 配可信 IP；sk_test_ 走沙盒演示）</label>
    <input id="key" placeholder="sk_live_... 或 sk_test_...">
    <label>选择本终端守护的门</label>
    <div class="row">
      <select id="door"><option value="">— 先填 Key 并加载 —</option></select>
      <button class="ghost" style="flex:0 0 96px;margin-top:0" onclick="loadDoors()">加载门</button>
    </div>
    <div class="err" id="err"></div>
    <button onclick="start()">进入扫码</button>
    <div class="hint">提示：动态码 45 秒失效且一次性，截图无法复用。设备需摄像头权限；不支持摄像头时可用「手动输入」。</div>
  </div>

  <div class="card" id="scanBox" style="display:none">
    <div style="font-weight:600;margin-bottom:8px">守护：<span id="doorName">—</span></div>
    <video id="video" playsinline muted></video>
    <div id="noCam" class="hint" style="display:none">本浏览器不支持原生扫码（BarcodeDetector）。请用下方手动输入，或换用较新的 Chrome/Edge。</div>
    <label>手动输入开门码</label>
    <input id="manual" placeholder="qr1....">
    <button onclick="submitManual()">开门校验</button>
    <button class="ghost" onclick="stop()">返回设置</button>
    <div class="err" id="err2"></div>
  </div>
</div>

<div class="result" id="result">
  <div class="icon" id="rIcon"></div>
  <div class="big" id="rBig"></div>
  <div class="who" id="rWho"></div>
  <div class="reason" id="rReason"></div>
</div>

<script>
const $ = id => document.getElementById(id);
let stream = null, detector = null, scanning = false, lastCode = '', lastAt = 0, rafTimer = null;

// 持久化
$('base').value = localStorage.getItem('acc_base') || location.origin;
$('key').value  = localStorage.getItem('acc_key')  || '';

function apiBase() { return ($('base').value || location.origin).replace(/\/+$/, ''); }
function authHeaders() { return { 'Authorization': 'Bearer ' + $('key').value.trim(), 'Content-Type': 'application/json' }; }

async function loadDoors() {
  $('err').textContent = '';
  const key = $('key').value.trim();
  if (!key) { $('err').textContent = '请先填写 API Key'; return; }
  localStorage.setItem('acc_base', $('base').value.trim());
  localStorage.setItem('acc_key', key);
  try {
    const r = await fetch(apiBase() + '/api/v1/access/doors', { headers: authHeaders() });
    const d = await r.json();
    if (!r.ok) { $('err').textContent = d.error || ('加载失败 ' + r.status); return; }
    const sel = $('door'); const saved = localStorage.getItem('acc_door');
    sel.innerHTML = (d.data || []).map(x => `<option value="${x.id}">${esc(x.name)}${x.location ? ' · ' + esc(x.location) : ''}</option>`).join('') || '<option value="">（无可用门）</option>';
    if (saved) sel.value = saved;
    $('err').textContent = (d.data || []).length ? '' : '没有已启用的门，请先到后台「门禁管理」新建。';
  } catch (e) { $('err').textContent = '网络错误：' + e.message; }
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function start() {
  if (!$('door').value) { $('err').textContent = '请先选择门（点「加载门」）'; return; }
  localStorage.setItem('acc_door', $('door').value);
  $('doorName').textContent = $('door').selectedOptions[0]?.textContent || '—';
  $('setup').style.display = 'none';
  $('scanBox').style.display = 'block';
  $('scanBox').classList.add('on');
  if (!('BarcodeDetector' in window)) { $('noCam').style.display = 'block'; return; }
  try {
    detector = new window.BarcodeDetector({ formats: ['qr_code'] });
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    $('video').srcObject = stream; await $('video').play();
    scanning = true; loop();
  } catch (e) { $('noCam').style.display = 'block'; $('noCam').textContent = '无法启用摄像头：' + e.message + '（可用手动输入）'; }
}
function stop() {
  scanning = false; if (rafTimer) cancelAnimationFrame(rafTimer);
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('scanBox').style.display = 'none'; $('scanBox').classList.remove('on'); $('setup').style.display = 'block';
}
async function loop() {
  if (!scanning) return;
  try {
    const codes = await detector.detect($('video'));
    if (codes && codes.length) {
      const val = codes[0].rawValue || '';
      const now = Date.now();
      if (val && (val !== lastCode || now - lastAt > 4000)) { lastCode = val; lastAt = now; verify(val); }
    }
  } catch (_) {}
  rafTimer = requestAnimationFrame(loop);
}
function submitManual() {
  const v = $('manual').value.trim();
  if (!v) { $('err2').textContent = '请输入开门码'; return; }
  verify(v); $('manual').value = '';
}
async function verify(code) {
  $('err2').textContent = '';
  try {
    const r = await fetch(apiBase() + '/api/v1/access/verify', {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ door_id: $('door').value, code }),
    });
    const d = await r.json();
    if (!r.ok) { $('err2').textContent = d.error || ('校验失败 ' + r.status); return; }
    showResult(d);
  } catch (e) { $('err2').textContent = '网络错误：' + e.message; }
}
function beep(ok) {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = ok ? 880 : 220; o.type = 'sine';
    g.gain.setValueAtTime(0.15, ac.currentTime);
    o.start(); o.stop(ac.currentTime + (ok ? 0.18 : 0.45));
  } catch (_) {}
}
let resultTimer = null;
function showResult(d) {
  const allow = !!d.allow;
  const wait = d.result === 'pending_escort';   // v3.5.29：访客已核验，等陪同人扫码
  const box = $('result');
  box.className = 'result show ' + (allow ? 'allow' : wait ? 'wait' : 'deny');
  $('rIcon').textContent = allow ? '✅' : wait ? '⏳' : '⛔';
  $('rBig').textContent = allow ? '通行' : wait ? '等待陪同人' : '拒绝';
  const who = d.user ? (d.user.name + ' #' + String(d.user.uid_seq).padStart(5, '0')) : (d.visitor && d.visitor.name ? '访客 ' + d.visitor.name : '');
  $('rWho').textContent = who + (d.escorted && d.escorted.length ? '　带入：' + d.escorted.join('、') : '');
  $('rReason').textContent = d.reason_text || d.reason || '';
  beep(allow);
  clearTimeout(resultTimer);
  resultTimer = setTimeout(() => { box.className = 'result'; }, wait ? 5000 : 2600);
}
// 自动尝试加载（已存 key 时）
if ($('key').value) loadDoors();
</script>
</body>
</html>
